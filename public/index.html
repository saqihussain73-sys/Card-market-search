<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Market Search — Riftbound</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}
body{margin:0;background:#0e1118;color:#f0f2f8;padding:20px;line-height:1.45}
main{max-width:950px;margin:auto}h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem)}
.sub,.muted{color:#a8b0c2}.sub{margin:6px 0 22px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
button{background:#4678ee;color:white;border:0;border-radius:10px;padding:12px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5}
#status{margin:16px 0;color:#b7c4db}#status.error{color:#ff9e9e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.box-card{border:1px solid #343d4e;background:#191f2b;border-radius:16px;padding:18px;min-width:0}
.box-card h2{margin:0 0 4px;font-size:1.25rem}.product{color:#b4bfd0;min-height:2.7em;margin:0 0 16px}
.prices{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid #364052}
.prices strong{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}.prices small{color:#a8b0c2}
.collect{display:flex;align-items:center;gap:9px;padding-top:12px;cursor:pointer}.collect input{width:18px;height:18px;accent-color:#4678ee}
.note{font-size:.85rem;color:#a8b0c2;margin-top:18px}
</style></head><body><main><h1>Card Market Search</h1><p class="sub">Riftbound · Individual sealed booster boxes</p>
<div class="toolbar"><div><strong>Riftbound sealed collection</strong><div class="muted" id="collection-count">0 collected</div></div><button id="load-btn">Refresh prices</button></div>
<div id="status" role="status">Loading Riftbound booster boxes…</div><section id="results" class="grid" aria-label="Riftbound booster boxes"></section>
<p class="note">USD prices from TCGplayer's daily mirror, not live UK retail offers. Collection selections are saved in this browser only.</p>
<script src="/app.js"></script></main></body></html>
